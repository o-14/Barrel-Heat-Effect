; Defaults for the Mod Configuration Menu panel.
;
; Section names and keys deliberately mirror Data\F4SE\Plugins\GunHeat.ini. MCM derives
; the section from the "id:Section" suffix in config.json and writes the player's choices
; to Data\MCM\Settings\GunHeat.ini, which the DLL then overlays on top of its own ini.
; That keeps MCM entirely optional - with MCM absent, GunHeat.ini is used unchanged.
;
; EVERY control on the panel must appear here, including the Advanced page. MCM needs a
; default to initialise a control from; with none it displays a junk value and silently
; fails to persist a change. 0.16.0 trimmed this file to the eleven core controls, which
; was correct while only those eleven were on the panel - and became the cause of the
; Advanced page reverting once the other nineteen were added back in 0.17.0.
;
; Generated from config.json so the two cannot drift. Keep in step with GunHeat.ini and
; the member defaults in Config.h.

[Haze]
fRefractionMaxStrength=0.04
fVisibilityCurve=1
fSizeWidth=0.8
fSizeHeight=0.5
fArtOffsetUp=1
fArtOffsetForward=0
bSmearEnabled=1
fSmearGain=0.015
fSmearMaxOffset=6
bPulseEnabled=1
fPulseStrength=0.01
fPulseDecaySeconds=0.3
fPuffScale=0.1
fPuffRise=0.5
fPuffScroll=0.15
fPuffVariance=0.35
iPuffMaxOverlap=6
fScrollTilesPerSecond=0.7

[Heat]
fHeatPerShot=0.07
fMaxFadeOutSeconds=20
bResetHeatOnWeaponSwitch=1
fMinHeatToShow=0.05
fMinFadeOutSeconds=8
fFadeInSeconds=3
fFadeOutSeconds=2.5
fEffectDurationSeconds=0

[Weapons]
bAllowAllWeapons=1
bExcludeEnergyWeapons=1

[Debug]
bDebugLogging=0

[CaliberScaling]
bEnabled=1
