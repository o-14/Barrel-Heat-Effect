; Barrel Heat Effect - settings
; Switches: 1 = on, 0 = off. Save changes and restart the game to apply all settings.
; Saved MCM settings in Data\MCM\Settings\BarrelHeatEffect.ini override this file.

[Haze]
; Effect record and muzzle attachment. Leave these unchanged for normal use.
sArtObjectPlugin=BarrelHeatEffect.esp
sArtObjectFormID=01000802
bPreferFireNode=1

; Distortion strength: maximum controls visibility. Leave minimum at 0.
fRefractionMinStrength=0.0
fRefractionMaxStrength=0.04

; Fade curve: below 1 keeps the effect visible longer; above 1 fades it sooner.
fVisibilityCurve=1.0
; Overall strength limit, from 0 to 1.
fIntensityCeiling=1.0

; Position relative to the muzzle, in game units.
fArtOffsetUp=1
fArtOffsetForward=0.0
fArtOffsetSide=0.0

; Width and height multipliers.
fSizeWidth=0.8
fSizeHeight=0.5

; Let the shimmer trail behind weapon movement.
bSmearEnabled=1
; Trail strength, maximum distance, and smoothing time (seconds).
fSmearGain=0.015
fSmearMaxOffset=6.0
fSmearSmoothing=0.10

; Brief pulses while firing: strength and fade time (seconds).
bPulseEnabled=1
fPulseStrength=0.01
fPulseDecaySeconds=0.30

; Puff expansion, upward movement, overlap limit, and random variation.
fPuffScale=0.1
fPuffRise=0.5
iPuffMaxOverlap=6
fPuffVariance=0.35

; Animate the distortion pattern: speed (tiles/second) and extra drift per puff.
bDriveScroll=1
fScrollTilesPerSecond=0.7
fPuffScroll=0.15

; Show the visual effect.
bRenderEnabled=1

[Heat]
; Heat added per shot. Higher values make the effect build faster.
fHeatPerShot=0.07
; Minimum heat needed to show the effect.
fMinHeatToShow=0.05
; Intensity multiplier, from 0 to 1.
fMaxIntensity=0.90
; Visual fade-in and fade-out times, in seconds.
fFadeInSeconds=3.0
fFadeOutSeconds=2.5
; Maximum duration after the last shot, in seconds. 0 uses normal cooling.
fEffectDurationSeconds=0.0
; Cooling time after a short burst and at full heat, in seconds.
fMinFadeOutSeconds=8.0
fMaxFadeOutSeconds=20.0
; Start cold when switching weapons.
bResetHeatOnWeaponSwitch=1

[CaliberScaling]
; Scale heat per shot using ammo damage.
bEnabled=1
; Reference damage, minimum/maximum heat multipliers, and scaling curve.
fReferenceDamage=30.0
fMinMultiplier=0.55
fMaxMultiplier=1.80
fDamageExponent=0.50

[Weapons]
; Allow all guns, subject to the energy-ammo filter below.
bAllowAllWeapons=1
; Allowed weapon FormIDs when the switch above is off; comma-separated.
sAllowedWeaponFormIDs=0000463F

; Exclude energy weapons, including Gauss. Ballistic Miniguns remain allowed.
bExcludeEnergyWeapons=1
; Optional replacement energy-ammo list. Remove the leading semicolon to edit.
; An empty list disables the filter. Remove 0018ABDF to allow Gauss ammo.
;sEnergyAmmoFormIDs=000C1897,000AB4FE,001262F2,0001DBB7,00075FE4,001BBFCA,00178D66,000865EA,0018ABE2,000DF279,001025AA,0018ABDF

[Debug]
; Enable only when reporting a problem; leave off for normal play.
; Log: Documents\My Games\Fallout4\F4SE\BarrelHeatEffect.log
bDebugLogging=0
