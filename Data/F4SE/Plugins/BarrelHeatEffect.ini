; =======================================================================================
; Barrel Heat Effect - settings
;
; Every setting works with or without Mod Configuration Menu. Edit this file with any text
; editor, save, and the change is picked up the next time you fire; a few need a restart.
;
; If you have MCM, the panel shows the settings most worth changing mid-game on its first
; page and the rest on an Advanced page.
;
; IMPORTANT - MCM wins over this file. Anything you have ever changed in the MCM panel is
; saved to Data\MCM\Settings\BarrelHeatEffect.ini and applied on top of this file, so a value you
; edit here may appear to do nothing. Delete that line from the MCM file - or delete the
; whole file - to hand the setting back to this one.
;
; Troubleshooting is at the bottom, under [Debug].
; =======================================================================================

[Haze]
; Where the effect comes from. Do not change these two unless you have replaced the
; plugin's own effect record with your own.
sArtObjectPlugin=BarrelHeatEffect.esp
sArtObjectFormID=01000802

; Which point on the gun the shimmer hangs from.
; 1 = ask the game for the equipped weapon's muzzle, including any barrel mod you have
;     fitted. This is what makes the effect work on modded guns with no patching.
; 0 = search the gun's skeleton for a muzzle node by name instead.
; Either way the node that was chosen is written to the log.
bPreferFireNode=1

; How strongly the air distorts. This is the main "how visible is it" setting.
; For scale, Fallout 4's own effects run from about 0.03 for a faint heat mirage to 0.20
; for the Minigun and flamer. 0.04 is deliberately subtle.
; fRefractionMinStrength is the distortion at the moment heat becomes visible; leave it 0.
fRefractionMinStrength=0.0
fRefractionMaxStrength=0.04

; Shape of the fade as the barrel cools. 1.0 fades evenly.
; Below 1.0 keeps the shimmer readable later into the cool-down without making the peak
; any stronger - try 0.5 if it seems to vanish too early. Above 1.0 fades away sooner.
fVisibilityCurve=1.0
; Upper limit on the whole effect, 0.0 to 1.0. Lower it to scale everything down at once.
fIntensityCeiling=1.0

; Where the shimmer sits relative to the muzzle, in game units. Up is away from the
; barrel, forward is along it, side is left or right.
; Lifting it clear of the barrel makes it read as heat rising rather than a patch stuck to
; the gun. If it moves the wrong way on your setup, use a negative number.
fArtOffsetUp=1
fArtOffsetForward=0.0
fArtOffsetSide=0.0

; Size of the shimmer on screen. 1.0 is the authored size; these are width and height as
; you see them, whichever way the camera faces.
fSizeWidth=0.8
fSizeHeight=0.5

; Trailing. The shimmer is pinned to the muzzle, so without this it swings with the gun as
; if the hot air were glued to it. This lets it lag behind when you swing or walk.
; bSmearEnabled  1 = on.
; fSmearGain     how far it trails for a given speed of movement. Higher trails more.
; fSmearMaxOffset a limit, so a fast turn cannot fling it off the gun.
; fSmearSmoothing how quickly it settles back, in seconds.
bSmearEnabled=1
fSmearGain=0.015
fSmearMaxOffset=6.0
fSmearSmoothing=0.10

; Per-shot kick. Each shot disturbs the plume instead of the shimmer just growing smoothly,
; so firing into an already hot barrel visibly puffs. It does nothing on a cold barrel.
; fPulseStrength     size of one shot's kick.
; fPulseDecaySeconds how long a kick takes to die away.
bPulseEnabled=1
fPulseStrength=0.01
fPulseDecaySeconds=0.30

; Puffs. Every shot starts its own puff and they add together, so sustained fire rolls into
; one continuous billow rather than a repeating bump. Each puff also swells and drifts
; upward as it dissipates, which is what makes it look like hot air leaving the barrel.
; fPuffScale      how much a puff swells the shimmer (0.1 = up to 10% larger at its peak).
; fPuffRise       how far a puff drifts upward, in game units.
; iPuffMaxOverlap how many puffs can be alive at once; the oldest is dropped past this.
; fPuffVariance   random variation between puffs, so consecutive shots are not identical.
fPuffScale=0.1
fPuffRise=0.5
iPuffMaxOverlap=6
fPuffVariance=0.35

; Drift of the pattern within the shimmer, which is what makes the air look like it is
; moving. 0.7 tiles per second means one full pass every 1.43 seconds; Fallout 4's own
; Minigun heat runs 0.6.
; bDriveScroll 0 hands the drift back to the mesh's own fixed rate.
; fPuffScroll  extra drift added by each puff.
bDriveScroll=1
fScrollTilesPerSecond=0.7
fPuffScroll=0.15

; 0 turns the visual off completely while leaving the rest of the mod running. Useful when
; working out whether the mod is responsible for something you are seeing.
bRenderEnabled=1

[Heat]
; How much heat one shot adds, before the caliber scaling below. Higher makes the shimmer
; appear after fewer shots. Heat runs from 0 (cold) to 1 (as hot as it gets), so 0.07 means
; roughly fifteen shots of sustained fire to reach a fully hot barrel.
fHeatPerShot=0.07
; Heat below this shows nothing at all, so a couple of shots leave no shimmer.
fMinHeatToShow=0.05
; Scales the shimmer down across the board, 0.0 to 1.0.
fMaxIntensity=0.90
; Seconds for the shimmer to build up to the barrel's current heat.
fFadeInSeconds=3.0
; Seconds for the shimmer to disappear once the barrel has cooled past the threshold above.
; This is the visible fade, not how long the barrel stays hot - that is the pair below.
fFadeOutSeconds=2.5
; A hard limit, in seconds, on how long the shimmer can stay up after your last shot.
; 0 = no limit, and the cool-down below decides on its own.
fEffectDurationSeconds=0.0
; How long the barrel takes to cool, in seconds: fMinFadeOutSeconds after a short burst,
; up to fMaxFadeOutSeconds from a fully hot barrel. Firing again during the cool-down
; carries on from the heat that is already there rather than starting cold.
; At the defaults a fully hot barrel stops shimmering about 19 seconds after the last shot.
fMinFadeOutSeconds=8.0
fMaxFadeOutSeconds=20.0

; 1 = drawing a different weapon starts it cold, since the heat belonged to the gun you put
; away. Any shimmer still on screen fades out normally rather than blinking off.
; 0 = heat carries across weapons.
bResetHeatOnWeaponSwitch=1

[CaliberScaling]
; Scales heat per shot by the round you are firing, using the ammo's damage to tell a big
; round from a small one. A .50 heats the barrel faster than a .38, and modded ammo works
; too without anyone patching it.
; bEnabled         1 = on.
; fReferenceDamage the damage that counts as normal and gets heat per shot unchanged.
; fMinMultiplier   floor and ceiling on the scaling, so nothing becomes absurd.
; fMaxMultiplier
; fDamageExponent  how sharply damage translates into heat. 0.5 is gentle; 1.0 is direct.
bEnabled=1
fReferenceDamage=30.0
fMinMultiplier=0.55
fMaxMultiplier=1.80
fDamageExponent=0.50

[Weapons]
; 1 = every gun, vanilla or modded. Melee weapons, grenades and mines never trigger the
; effect whatever this is set to.
bAllowAllWeapons=1
; Guns that are always allowed even with bAllowAllWeapons=0, as comma-separated form IDs.
; 0000463F is the vanilla Assault Rifle.
sAllowedWeaponFormIDs=0000463F

; 1 = skip energy weapons: laser, plasma, gamma, cryo, gauss, alien blaster and the Gatling
; laser. Nothing on a weapon's record marks it as an energy weapon - the game files type a
; laser rifle exactly like a pipe rifle - so this works off the ammo instead, which also
; covers modded energy guns, because they almost all reuse the vanilla ammo.
;
; Note this does NOT skip the Minigun, which fires ballistic 5mm (0001F66C). The energy
; gatling gun is the Gatling Laser, which runs on a fusion core and is skipped.
bExcludeEnergyWeapons=1
; The ammo treated as energy, as comma-separated form IDs. Setting this REPLACES the list
; below rather than adding to it, so a load order with its own energy ammo can be described
; exactly; an empty value turns the filter off. The built-in list is:
;   000C1897 Fusion Cell            000AB4FE Fusion Cell (Eyebot)
;   001262F2 Fusion Cell (lt blue)  0001DBB7 Plasma Cartridge
;   00075FE4 Fusion Core            001BBFCA Fusion Core (no steal)
;   00178D66 Fusion Core (meltdown) 000865EA Fusion Core (knight meltdown)
;   0018ABE2 Cryo Cell              000DF279 Gamma Cell
;   001025AA Alien Blaster Round    0018ABDF 2mm Electromagnetic (Gauss)
; Uncomment and edit to override. Drop 0018ABDF if you count the Gauss rifle as ballistic.
;sEnergyAmmoFormIDs=000C1897,000AB4FE,001262F2,0001DBB7,00075FE4,001BBFCA,00178D66,000865EA,0018ABE2,000DF279,001025AA,0018ABDF

[Debug]
; 1 = write a detailed log to:
;   Documents\My Games\Fallout4\F4SE\BarrelHeatEffect.log
; Turn this on if you are reporting a problem, play until you see it, then send that file.
; It is about a megabyte per session and is rewritten each time the game starts, so leave
; it off for normal play.
bDebugLogging=0
